events {
    worker_connections 1024;
}

http {
    # Grupo de servidores backend (balanceo Round Robin por defecto)
    upstream backend_cluster {
        server backend1:5000;
        server backend2:5000;
        server backend3:5000;
        keepalive 32;
    }

    # Servidor principal (proxy inverso)
    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Muestra qué backend atendió la petición (útil para demostrar el balanceo)
            add_header X-Backend $upstream_addr always;
        }
    }

    # Servidor interno para métricas (stub_status). El puerto 8080 no se publica al host.
    server {
        listen 8080;

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
